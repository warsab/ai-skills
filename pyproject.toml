[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
pythonpath = ["scripts"]
addopts = "-ra --doctest-modules"

[tool.ruff]
line-length = 90
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103"]
